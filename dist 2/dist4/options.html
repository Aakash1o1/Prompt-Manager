<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Prompt Drawer — Options</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body {
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
      padding: 18px;
      color: #111;
      background: #f7fafc;
    }

    h1 {
      margin: 0 0 12px 0;
      font-size: 18px;
    }

    label {
      display: block;
      margin-top: 12px;
      font-weight: 600;
    }

    input[type="text"] {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #ddd;
      margin-top: 6px
    }

    button {
      margin-top: 10px;
      padding: 8px 12px;
      border-radius: 6px;
      border: none;
      background: #2b7bdb;
      color: #fff;
      cursor: pointer;
    }

    ul {
      padding-left: 18px;
      margin-top: 12px;
    }

    li {
      margin-bottom: 8px;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .host {
      flex: 1;
    }

    .small {
      font-size: 13px;
      color: #666
    }

    .danger {
      background: #e02424
    }
  </style>
</head>

<body>
  <h1>Prompt Drawer — Allowed sites</h1>
  <p class="small">Add the current site to allow the Prompt Drawer to be used here.</p>

  <div>
    <button id="add-current-site-btn" style="width: 100%; text-align: center;">Add my prompts to this site</button>
  </div>

  <h2 style="margin-top:18px">Enabled sites</h2>
  <ul id="hosts-list"></ul>

  <!-- When this HTML is copied to , this will load options.js -->
  <script src="options.js"></script>
</body>

</html>
